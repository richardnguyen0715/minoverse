[project]
name = "minoverse-scraping"
version = "0.1.0"
description = "Minoverse Scraping Service — multi-source content extraction"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "playwright>=1.49",
    "yt-dlp>=2024.12.3",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "tenacity>=9.1",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "nats-py>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.12"
