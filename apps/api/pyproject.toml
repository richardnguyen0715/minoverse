[project]
name = "minoverse-api"
version = "0.1.0"
description = "Minoverse API — AI-native Knowledge OS backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "dramatiq[redis]>=1.17",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "markdown-it-py>=3.0",
    "python-frontmatter>=1.1",
    "typer>=0.12",
    "watchfiles>=0.21",
    "ollama>=0.4.0",
    "httpx>=0.27",
    "tenacity>=9.1.4",
    "pyyaml>=6.0.3",
    "google-genai>=1.0",
    "google-auth>=2.0",
]

[project.scripts]
minoverse = "src.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
